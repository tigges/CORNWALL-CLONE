name: Deploy static preview to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - wp-content/themes/cornwall-dry-cleaners/assets/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage static preview
        run: |
          mkdir -p _site/wp-content/themes/cornwall-dry-cleaners
          cp index.html _site/index.html
          cp -R wp-content/themes/cornwall-dry-cleaners/assets _site/wp-content/themes/cornwall-dry-cleaners/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
